<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/adsci-library/manifest.json">
<title>Advisory Science Resource Library</title>
<style>
:root{--teal:#1A8A7D;--dark:#1B4D5C;--coral:#E07a5f;--cream:#FAF5EE;--gold:#E8D48A;--mint:#B8D8D0;--line:#e7ded2;--green:#2e7d57;--red:#c0392b}
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;margin:0;padding:0}
body{background:var(--cream);color:var(--dark)}
header{background:var(--dark);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:17px;letter-spacing:.5px;white-space:nowrap}
.modenav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mnbtn{padding:6px 12px;border-radius:16px;background:#2a5f70;color:#fff;border:0;font-weight:700;font-size:12px;cursor:pointer}
.mnbtn.on{background:var(--gold);color:var(--dark)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.tab{padding:6px 14px;border-radius:14px;background:#eee;color:var(--dark);border:0;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--dark);color:#fff}
.bar{padding:10px 20px;display:flex;gap:10px;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
#q{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.count{color:#888;font-size:12px;white-space:nowrap}
main{padding:14px 20px;max-width:1100px;margin:0 auto}
.group h2{font-size:14px;color:var(--teal);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:16px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:7px 0}
.ctop{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cmeta{flex:1;min-width:150px}
.ref{display:inline-block;background:var(--cream);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;color:#888;margin-bottom:3px}
.ctitle{font-weight:700;font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--mint);color:var(--dark);margin-right:4px}
.badge.wb{background:var(--gold)}.badge.ks1{background:var(--coral);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
a.btn{text-decoration:none;padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:700;border:1px solid transparent;display:inline-block}
.b-drive{background:var(--teal);color:#fff}
.b-vid{background:var(--dark);color:#fff}
.b-mcq{background:var(--gold);color:var(--dark)}
.b-soon{background:#f0ece4;color:#aaa;padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:700;display:inline-block}
/* flaggable pill: action + flag tab fused */
.pill{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid transparent}
.pill a,.pill span.pa{text-decoration:none;padding:7px 10px;font-size:12.5px;font-weight:700;display:inline-block}
.pill .pf{padding:7px 8px;cursor:pointer;border:none;font-size:12px;border-left:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.12);color:inherit;display:inline-block}
.pill .pf.on{background:var(--red);color:#fff}
.pill.p-drive{background:var(--teal);color:#fff;border-color:var(--teal)}
.pill.p-vid{background:var(--dark);color:#fff;border-color:var(--dark)}
.pill.p-ws{background:var(--coral);color:#fff;border-color:var(--coral)}
.pill.p-slides{background:#7b68ee;color:#fff;border-color:#7b68ee}
.pill.p-soon{background:#f0ece4;color:#aaa;border-color:#e0d9d0}
/* Quiz */
#quiz-overlay{display:none;position:fixed;inset:0;background:var(--cream);z-index:200;overflow-y:auto}
.qheader{background:var(--dark);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
.qback{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:0 6px}
.qheader h2{font-size:16px;margin:0}
.qheader .qlabel{color:#bcd;font-size:12px}
.qmain{max-width:800px;margin:0 auto;padding:16px 20px}
.score-bar{position:sticky;top:60px;background:var(--cream);padding:8px 0;font-weight:700;color:var(--teal);font-size:14px;z-index:10}
.qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.qnum{font-size:11px;color:#999;margin-bottom:4px}
.qtext{font-weight:700;font-size:15px;margin-bottom:10px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:10px 13px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;cursor:pointer;line-height:1.3}
.opt:hover{border-color:var(--teal)}
.opt.correct{background:#e7f5ee;border-color:var(--green);color:var(--green);font-weight:700}
.opt.wrong{background:#fdeceb;border-color:var(--red);color:var(--red)}
.fb{margin-top:8px;font-size:13px;color:#555;border-left:3px solid var(--gold);padding:5px 10px;display:none;line-height:1.4}
footer{padding:16px 20px;color:#aaa;font-size:11px;text-align:center}
/* Flag button */
.b-flag{background:#fff;border:1px solid var(--line);color:#aaa;padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer}
.b-flag.flagged{background:#fdeceb;border-color:var(--red);color:var(--red)}
/* Notes panel */
#notes-fab{position:fixed;bottom:20px;right:20px;background:var(--coral);color:#fff;border:0;border-radius:50px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:300;display:none}
#notes-overlay{display:none;position:fixed;inset:0;background:var(--cream);z-index:400;overflow-y:auto}
.nheader{background:var(--dark);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
.nback{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:0 6px}
.nheader h2{font-size:16px;margin:0;flex:1}
.ncopy{background:var(--gold);color:var(--dark);border:0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.nclear{background:#fdeceb;color:var(--red);border:0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.nmain{max-width:800px;margin:0 auto;padding:16px 20px}
.nitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.nitem-title{font-weight:700;font-size:14px;margin-bottom:4px}
.nitem-note{font-size:13px;color:#555;margin-bottom:8px}
.nitem-meta{font-size:11px;color:#999}
.nedit{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;margin-right:6px}
.ndel{background:none;border:1px solid #fcc;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--red)}
.nempty{color:#999;padding:40px;text-align:center}
/* Flag modal */
#flag-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
#flag-modal.open{display:flex}
.fbox{background:#fff;border-radius:14px;padding:20px;width:90%;max-width:420px}
.fbox h3{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.fbox textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;height:90px;resize:none;font-family:inherit}
.fbox-acts{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.fsave{background:var(--coral);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer}
.fcancel{background:#eee;color:var(--dark);border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
/* Review mode */
#review-btn{padding:6px 13px;border-radius:16px;background:var(--coral);color:#fff;border:0;font-weight:700;font-size:12px;cursor:pointer;display:none}
#review-overlay{display:none;position:fixed;inset:0;background:var(--cream);z-index:500;overflow-y:auto}
.rheader{background:var(--coral);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0}
.rheader h2{margin:0;font-size:16px;flex:1}
.rprog{font-size:13px;opacity:.85}
.rback{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.rmain{max-width:820px;margin:0 auto;padding:18px 20px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.rtype{display:inline-block;background:var(--gold);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;margin-bottom:6px}
.rtitle{font-weight:700;font-size:17px;margin-bottom:4px}
.rnote{font-size:14px;color:#555;margin:8px 0;padding:8px 12px;border-left:3px solid var(--coral);background:#fdf6f5}
.rmeta{font-size:12px;color:#999;margin-bottom:12px}
.ract{display:flex;gap:10px;flex-wrap:wrap}
.r-fix{background:var(--green,#2e7d57);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
.r-skip{background:#eee;color:var(--dark);border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
.r-open{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;text-decoration:none}
.r-done{text-align:center;padding:40px;color:var(--teal);font-weight:700;font-size:18px}
.pickbtn{background:#fff;border:1px solid var(--teal);color:var(--teal);font-weight:700;font-size:13px;border-radius:8px;padding:8px 13px;cursor:pointer;margin:4px 0 10px}
.pickbtn.on{background:var(--teal);color:#fff}
.pickcb{display:flex;align-items:center}
.pickcb input{width:20px;height:20px;accent-color:var(--teal)}
#pick-bar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--dark);color:#fff;padding:10px 16px;gap:10px;align-items:center;z-index:400;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
#pick-bar .pbcount{flex:1;font-weight:700;font-size:14px}
#pick-bar button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
#pick-bar .pbcopy{background:var(--gold);color:var(--dark)}
#pick-bar .pbopen{background:var(--mint);color:var(--dark)}
#pick-bar .pbclear{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
#viewer-overlay{display:none;position:fixed;inset:0;background:var(--cream);z-index:450;flex-direction:column}
#viewer-overlay.open{display:flex}
.vhead{display:flex;align-items:center;gap:8px;background:var(--dark);color:#fff;padding:10px 12px;flex-wrap:wrap}
.vhead .vtitle{flex:1;font-weight:700;font-size:14px;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vhead button,.vhead a{border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.vhead .vback{background:rgba(255,255,255,.15);color:#fff}
.vhead .vflag{background:var(--gold);color:var(--dark)}
.vhead .vopen{background:var(--mint);color:var(--dark)}
#viewer-frame{flex:1;width:100%;border:0;background:#fff}
</style>
</head><body>
<header>
  <h1>ADVISORY SCIENCE</h1>
  <button id="review-btn" onclick="openReview()">&#9873; Review flags</button>
  <div class="modenav" id="modenav"></div>
</header>
<div class="tabs" id="tabs"></div>
<div class="bar"><input id="q" placeholder="Search..."><span class="count" id="count"></span></div>
<main id="main"></main>
<footer>PDFs open in Google Drive. &copy; Advisory Science</footer>

<button id="notes-fab" onclick="openNotes()">&#128203; My Notes</button>

<div id="notes-overlay">
  <div class="nheader">
    <button class="nback" onclick="closeNotes()">&#8592;</button>
    <h2>My Review Notes</h2>
    <button class="ncopy" onclick="copyNotes()">Copy all</button>
    <button class="nclear" onclick="clearAll()">Clear all</button>
  </div>
  <div class="nmain" id="notes-list"></div>
</div>

<div id="viewer-overlay">
  <div class="vhead">
    <button class="vback" onclick="closeViewer()">&#8592; Back</button>
    <span class="vtitle" id="viewer-title"></span>
    <button class="vflag" id="viewer-flag">&#9873; Flag a problem</button>
    <a class="vopen" id="viewer-open" target="_blank" rel="noopener">Open in Drive</a>
  </div>
  <iframe id="viewer-frame" title="Worksheet preview"></iframe>
</div>

<div id="flag-modal">
  <div class="fbox">
    <h3 id="flag-modal-title"></h3>
    <input id="flag-reviewer" placeholder="Your name (Brenda / Divine)" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;margin-bottom:8px;font-family:inherit">
    <select id="flag-category" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;margin-bottom:8px;font-family:inherit;background:#fff;color:var(--dark)">
      <option value="">Category (optional)</option>
      <option value="Visual">Visual - layout, images, labels look off</option>
      <option value="Content">Content - wrong info, wrong label, wrong age group</option>
      <option value="Video">Video - audio, pacing, wrong video, branding</option>
      <option value="Language">Language - spelling, too hard/easy, unclear</option>
      <option value="Missing">Missing - blank page, cut off, incomplete</option>
    </select>
    <textarea id="flag-note" placeholder="Details (optional) e.g. page 2, timestamp 0:34"></textarea>
    <div class="fbox-acts">
      <button class="fcancel" onclick="closeFlag()">Cancel</button>
      <button class="fsave" onclick="saveFlag()">Save note</button>
    </div>
  </div>
</div>

<div id="review-overlay">
  <div class="rheader">
    <button class="rback" onclick="closeReview()">&#8592;</button>
    <h2>Flag Review</h2>
    <span class="rprog" id="review-prog"></span>
  </div>
  <div class="rmain" id="review-main"></div>
</div>

<div id="quiz-overlay">
  <div class="qheader">
    <button class="qback" onclick="closeQuiz()">&#8592;</button>
    <div><h2 id="qtitle"></h2><div class="qlabel" id="qlabel"></div></div>
  </div>
  <div class="qmain">
    <div class="score-bar" id="qscore"></div>
    <div id="qcards"></div>
  </div>
</div>

// decompress data
async function loadData(){
  const bin=atob(RAW);
  const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const writer=ds.writable.getWriter(); writer.write(buf); writer.close();
  const out=await new Response(ds.readable).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(out));
}

function btn(label,cls,href){
  return href?`<a class="btn ${cls}" href="${href}" target="_blank" rel="noopener">${label}</a>`
             :`<span class="b-soon">${label}</span>`;
}
// pill: action button + inline flag tab fused together
function pill(label, pillcls, href, flagSubject, flagRef, flagTitle, resourceType, onclickJs){
  const fk = flagKey(flagSubject, flagRef, flagTitle + "|" + resourceType);
  const flagged = isFlagged(fk);
  const action = href
    ? `<a class="pa" href="${href}" target="_blank" rel="noopener"${onclickJs?` onclick='${onclickJs};return false'`:""}>${label}</a>`
    : `<span class="pa" style="color:#aaa">${label}</span>`;
  const ft = `<button class="pf${flagged?" on":""}" title="Flag this ${resourceType}" onclick='openFlag(${JSON.stringify(flagSubject)},${JSON.stringify(flagRef)},${JSON.stringify(flagTitle+"|"+resourceType)})'>&#9873;</button>`;
  return `<span class="pill ${pillcls}">${action}${ft}</span>`;
}

// ---- In-app worksheet viewer with a flag button on the open worksheet ----
function openViewer(url,subject,paper,title){
  const pre=url.replace(/\/view.*$/,"/preview");
  document.getElementById("viewer-frame").src=pre;
  document.getElementById("viewer-title").textContent=title;
  document.getElementById("viewer-open").href=url;
  document.getElementById("viewer-flag").onclick=()=>openFlag(subject,paper,title+"|slides");
  document.getElementById("viewer-overlay").classList.add("open");
}
function closeViewer(){
  document.getElementById("viewer-overlay").classList.remove("open");
  document.getElementById("viewer-frame").src="about:blank";
}

// ---- Tutee share: tick worksheets, copy their links as one pack ----
let pickMode=false, picked={};
function togglePick(){ pickMode=!pickMode; renderMain(); }
function pickToggle(url,title){ if(picked[url]) delete picked[url]; else picked[url]={title,url}; updatePickBar(); }
function clearPick(){ picked={}; renderMain(); }
function openAllPicked(){ const l=Object.values(picked); if(!l.length){alert("Tick some worksheets first.");return;} l.forEach(p=>window.open(p.url,"_blank")); }
function copyPicked(){
  const l=Object.values(picked);
  if(!l.length){alert("Tick some worksheets first.");return;}
  const text=l.map(p=>p.title+"\n"+p.url).join("\n\n");
  navigator.clipboard.writeText(text).then(
    ()=>alert(l.length+" worksheet link"+(l.length>1?"s":"")+" copied. Paste into WhatsApp, email or Google Classroom for your tutee."),
    ()=>prompt("Copy these links:",text));
}
function updatePickBar(){
  let bar=document.getElementById("pick-bar");

let _flags = {};  // local cache, loaded on init

function flagKey(subject,paper,title){return [subject,paper,title].filter(Boolean).join("|");}

async function loadFlags(){

let _flagKey="", _flagTitle="", _flagPhase="";

let _reviewKeys=[], _reviewIdx=0;

function showReviewItem(){
  const box=document.getElementById("review-main");

  if(!_reviewKeys.length||_reviewIdx>=_reviewKeys.length){
    prog.textContent="";
    box.innerHTML='<div class="r-done">All flags reviewed.</div>';
    return;
  }
  prog.textContent=`${_reviewIdx+1} of ${_reviewKeys.length}`;
  const k=_reviewKeys[_reviewIdx];
  const f=_flags[k];
  const parts=f.title.split("|");
  const rtype={"pdf":"PDF","video":"Video","slides":"Slides","folder":"Folder","ws":"Worksheet"}[parts[1]]||parts[1]||"";
  const rtitle=parts[0];
  const d=f.ts?new Date(f.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";

  if(phase==="KS2"||phase==="GCSE"||phase==="A Level"||phase==="ELC"||phase==="KS3"){
    // search data for matching item
    const pool=[...(D.ks2||[]),(D.gcse||[]),(D.alevel||[]),(D.elc||[]),(D.ks3||[])].flat();
    const match=pool.find(r=>(r.title||"").replace(/\|.*/,"")===rtitle);
    if(match) resourceUrl=parts[1]==="video"?(match.video||match.drive):match.drive;
  } else if(phase==="KS1"){

    const match=pool.find(r=>(r.title||"")===rtitle);
    if(match) resourceUrl=parts[1]==="video"?(match.video||match.drive):match.drive;
  } else if(phase==="EYFS"){
    const match=(D.eyfs||[]).find(r=>r.title===rtitle);

        ${f.category?`<span class="rtype" style="background:var(--dark);margin-left:4px">${f.category}</span>`:""}
      </div>

      <div class="rmeta">Flagged by ${f.reviewer||"Anonymous"} &middot; ${d} &middot; ${phase}</div>
      ${f.note?`<div class="rnote">${f.note}</div>`:'<div class="rnote" style="color:#bbb;font-style:italic">No note added</div>'}
      <div class="ract">
        ${resourceUrl?`<a class="r-open" href="${resourceUrl}" target="_blank">Open ${rtype||"resource"}</a>`:""}
        <button class="r-fix" onclick="reviewAction('fix')">Fix needed</button>
        <button class="r-skip" onclick="reviewAction('ok')">Looks OK</button>
      </div>
    </div>
    ${_reviewIdx+1<_reviewKeys.length?`<p style="color:#aaa;font-size:12px;text-align:center;margin-top:8px">${_reviewKeys.length-_reviewIdx-1} more to review</p>`:""}
  `;
}
function reviewAction(action){
  if(action==="fix"){
    // mark as needs fix in the sheet
    const k=_reviewKeys[_reviewIdx];
    const f={..._flags[k], needsFix:true};
    _flags[k]=f;
    if(SCRIPT_URL&&SCRIPT_URL!=="PASTE_SCRIPT_URL_HERE"){
      fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({...f,key:k,note:(f.note||"")+" [FIX NEEDED]"})}).catch(()=>{});

  showReviewItem();

// Offline queue: flags that couldn't reach the sheet yet
const Q_KEY = "adsci_queue";
function getQueue(){try{return JSON.parse(localStorage.getItem(Q_KEY)||"[]");}catch{return [];}}
function saveQueue(q){localStorage.setItem(Q_KEY,JSON.stringify(q));}

async function syncQueue(){
  const queue = getQueue();
  if(!queue.length) return;
  const btn = document.getElementById("sync-btn");
  if(btn) btn.textContent = "Syncing...";
  let remaining = [];
  for(const item of queue){
    try{
      await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(item)});
    } catch(e){
      remaining.push(item);  // keep if still offline
    }
  }
  saveQueue(remaining);
  updateSyncBtn();
  if(!remaining.length) await loadFlags().then(renderNotesList);
}

function updateSyncBtn(){
  const n = getQueue().length;
  let btn = document.getElementById("sync-btn");
  if(!btn){
    btn = document.createElement("button");
    btn.id = "sync-btn";
    btn.style.cssText = "position:fixed;bottom:80px;right:20px;background:var(--dark);color:#fff;border:0;border-radius:50px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:300;display:none";
    btn.onclick = syncQueue;
    document.body.appendChild(btn);
  }
  btn.style.display = n ? "block" : "none";
  btn.textContent = n ? `Sync ${n} flag${n>1?"s":""} now` : "";
}

// override saveFlag: confirm the note actually reached the shared sheet; never fail silently
const _origSaveFlag = saveFlag;
async function saveFlag(){
  const note=document.getElementById("flag-note").value.trim();
  const reviewer=document.getElementById("flag-reviewer").value.trim()||"Anonymous";
  const category=document.getElementById("flag-category").value;
  const entry={key:_flagKey,title:_flagTitle,note,category,phase:_flagPhase,reviewer,ts:new Date().toISOString()};
  _flags[_flagKey]=entry;            // optimistic on-screen update
  closeFlag(); renderMain(); updateFab();
  const queueIt=(msg)=>{
    const q=getQueue().filter(i=>i.key!==entry.key); q.push(entry); saveQueue(q); updateSyncBtn();
    alert(msg);
  };
  if(!(navigator.onLine && SCRIPT_URL && SCRIPT_URL!=="PASTE_SCRIPT_URL_HERE")){
    queueIt("Note saved on THIS device only, not sent to the shared sheet yet (you appear to be offline). Tap the 'Sync now' button (bottom-right) once you have a connection."); return;
  }
  try{
    await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(entry)});
    // verify it actually landed on the sheet (POST can silently no-op on a flaky link)
    const server=await (await fetch(SCRIPT_URL,{cache:"no-store"})).json();
    const s=server[entry.key];
    const landed = note ? (s && (s.note||"")===note) : !s;
    if(landed){ _flags=server; updateFab(); renderMain(); return; }
    queueIt("Saved on this device, but the shared sheet did not confirm it. Tap 'Sync now' (bottom-right) to retry. Do not assume it is saved.");
  } catch(e){
    queueIt("Could not reach the shared sheet. Note kept on this device. Tap 'Sync now' (bottom-right) to retry.");
  }
}

function mcqKey(subject,title){
  const s=subject.toLowerCase();
  if(mode=="alevel") return `alevel_${s.slice(0,3)}`;
  return "gcse";
}
function getMcqs(subject,title,paper){
  let bank=[];
  if(mode=="alevel"){
    const keymap={"Biology":"alevel_bio","Chemistry":"alevel_chem","Physics":"alevel_phys"};
    bank=D.mcq[keymap[subject]]||[];
  } else {
    bank=(D.mcq.gcse||[]).filter(q=>q.subj==subject&&q.paper=="Paper "+paper.slice(1));
  }
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ");
  const nt=norm(title);
  // exact unit match first
  let exact=bank.filter(q=>norm(q.unit)==nt||norm(q.lesson)==nt);
  if(exact.length) return exact.slice(0,15);
  // keyword match
  const kws=nt.split(" ").filter(w=>w.length>4&&!["using","which","their","where","these","those","about","other","would","could","should"].includes(w));
  if(!kws.length) return [];
  return bank.filter(q=>kws.some(k=>(q.unit+" "+q.lesson).toLowerCase().includes(k))).slice(0,15);
}

          ${r.video?pill("Watch","p-vid",r.video,"KS1","unit",r.title,"video"):""}
          ${sheets.map(w=>pill(w.title,"p-ws",w.drive,"KS1","ws",r.title+" - "+w.title,"worksheet")).join("")}
        </div></div></div>`;
      }).join("");
      return `<div class="group"><h2>${yr}</h2>${items}</div>`;
    }).join("");
  } else {
    const rows=(D.ks2||[]).filter(r=>!q||(r.title+" "+r.year+" "+r.type).toLowerCase().includes(q));
    document.getElementById("count").textContent=rows.length+" items";
    const yrs=[...new Set(rows.map(r=>r.year))].sort();
    document.getElementById("main").innerHTML=yrs.map(yr=>{
      const items=rows.filter(r=>r.year==yr).map(r=>`
        <div class="card"><div class="ctop">
          <span class="badge${r.type=="Workbook"?" wb":""}">${r.type}</span>
          <div class="cmeta"><div class="ctitle">${r.title}</div></div>
          <div class="acts">
            ${pill("View PDF","p-drive",r.drive,"KS2","",r.title,"pdf")}
            ${r.video?pill("Watch","p-vid",r.video,"KS2","",r.title,"video"):'<span class="b-soon">No video</span>'}
          </div></div></div>`).join("");
      return `<div class="group"><h2>${yr}</h2>${items}</div>`;
    }).join("");
  }
}

// Quiz
let quizTitle="", quizSubj="", quizPaper="";
function openQuiz(title,subj,paper_){
  quizTitle=title; quizSubj=subj; quizPaper=paper_;
  const qs=getMcqs(subj,title,paper_);
  document.getElementById("qtitle").textContent=title;
  document.getElementById("qlabel").textContent=mode=="alevel"?"A Level questions":"GCSE questions";
  const box=document.getElementById("qcards");
  box.innerHTML="";
  let done=0,right=0;
  const upd=()=>document.getElementById("qscore").textContent=`Score: ${right}/${done} answered (${qs.length} questions)`;
  if(!qs.length){box.innerHTML='<p style="color:#999;padding:30px;text-align:center">No questions yet for this topic.</p>';upd();return;}
  qs.forEach((q,i)=>{
    const c=document.createElement("div"); c.className="qcard";
    const opts=Object.entries(q.opts).map(([k,v])=>`<button class="opt" data-k="${k}">${k}. ${v}</button>`).join("");
    c.innerHTML=`<div class="qnum">Q${i+1}</div><div class="qtext">${q.q}</div>${opts}<div class="fb"></div>`;
    const fb=c.querySelector(".fb"); let answered=false;
    c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered)return; answered=true; done++;
      const k=b.dataset.k;
      if(k===q.ans){b.classList.add("correct");right++;}
      else{b.classList.add("wrong");c.querySelector(`[data-k="${q.ans}"]`).classList.add("correct");}
      fb.style.display="block"; fb.textContent=(k===q.ans?"Correct. ":"Correct answer: "+q.ans+". ")+(q.note||"");
      upd();
    });
    box.appendChild(c);
  });
  upd();
  document.getElementById("quiz-overlay").style.display="block";
  document.getElementById("quiz-overlay").scrollTop=0;
}
function closeQuiz(){document.getElementById("quiz-overlay").style.display="none";}

// Search
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase();renderMain();};

function renderElc(){
  const rows=(D.elc||[]).filter(r=>!q||(r.title+" "+r.ref).toLowerCase().includes(q));
  document.getElementById("count").textContent=rows.length+" lessons";
  const refs=[...new Set(rows.map(r=>r.ref))].sort();
  document.getElementById("main").innerHTML=refs.map(ref=>{
    const parts=rows.filter(r=>r.ref==ref);
    const p0=parts[0];
    const packActs=(p0.organisers||p0.assessments)?`<div class="acts" style="margin:0 0 10px 2px">
        ${p0.organisers?pill("Organisers","p-ws",p0.organisers,"ELC",ref,"Organisers","organisers"):""}
        ${p0.assessments?pill("Assessments","p-slides",p0.assessments,"ELC",ref,"Assessments","assessments"):""}
      </div>`:"";
    return `<div class="group"><h2>${ref}</h2>${packActs}`+parts.map(r=>`
      <div class="card"><div class="ctop">
        <span class="badge" style="background:var(--lavender,#D4C2DF);color:var(--dark)">P${r.part}</span>
        <div class="cmeta"><div class="ctitle">${r.title}</div></div>
        <div class="acts">
          ${pill("Resources","p-drive",r.drive,"ELC",ref,r.title,"slides")}
          ${r.video?pill("Watch","p-vid",r.video,"ELC",ref,r.title,"video"):'<span class="b-soon">No video</span>'}
        </div></div></div>`).join("")+"</div>";
  }).join("");
}

function renderMain(){
  if(mode=="alevel") renderAlevel();
  else if(mode=="gcse") renderGcse();
  else if(mode=="elc") renderElc();
  else renderPrimary();
  document.querySelectorAll(".tab").forEach(b=>{
    if(SUBJS.includes(b.textContent)) b.classList.toggle("on",b.textContent==sub);
    if(PAPERS.includes(b.textContent)) b.classList.toggle("on",b.textContent==paper);
    if(["KS1","KS2","KS3","EYFS"].includes(b.textContent)) b.classList.toggle("on",b.textContent==sub);
  });
  updateFab();
  updatePickBar();
}

// Init
loadData().then(data=>{
  D=data;
  loadFlags();
  updateFab();
  // mode nav
  const nav=document.getElementById("modenav");
  MODES.forEach(m=>{
    const b=document.createElement("button");
    b.className="mnbtn"+(m.k==mode?" on":"");
    b.dataset.m=m.k; b.textContent=m.label;
    b.onclick=()=>{mode=m.k;sub=mode=="primary"?"KS2":mode=="ks3"?"KS3":"Biology";render();};
    nav.appendChild(b);
  });
  render();
  updateSyncBtn();
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/adsci-library/sw.js");
}
